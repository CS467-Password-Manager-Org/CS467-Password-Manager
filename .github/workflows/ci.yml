name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # ubuntu-latest ships a running Docker daemon, which the api suite requires:
    # its Vitest global setup starts a real Postgres via Testcontainers.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches node:22-slim in api/Dockerfile and frontend/Dockerfile.
          node-version: 22
          cache: npm

      # ci, not install: the lockfile is the contract. A build that silently
      # floats transitive versions is exactly what this repo cannot afford.
      - name: Install dependencies
        run: npm ci

      # The committed lockfile was generated on macOS. npm records optional
      # platform binaries only for the host that generated the lockfile, so
      # this one contains just the darwin-arm64 builds of rolldown and
      # esbuild — rolldown declares 15 platform bindings and the lockfile has
      # 1. On Linux the frontend build then fails with
      #   Cannot find module '../rolldown-binding.linux-x64-gnu.node'
      # because the binding ships as a separate @rolldown/binding-<platform>
      # package that was never recorded.
      #
      # Install the Linux binaries explicitly, pinned to the versions the
      # lockfile already resolved for their parent packages, and with
      # --no-save --no-package-lock so neither package.json nor the lockfile
      # is modified. Everything else still comes from `npm ci`.
      #
      # This is a workaround for a real defect in the committed lockfile, not
      # a property of CI. Remove it once the lockfile carries all platforms.
      # Tracked in #100.
      - name: Install Linux build binaries absent from the lockfile
        run: |
          ROLLDOWN=$(node -p "require('rolldown/package.json').version")
          ESBUILD=$(node -p "require('esbuild/package.json').version")
          echo "rolldown=$ROLLDOWN esbuild=$ESBUILD"
          npm install --no-save --no-package-lock \
            "@rolldown/binding-linux-x64-gnu@${ROLLDOWN}" \
            "@esbuild/linux-x64@${ESBUILD}"
          git diff --exit-code package-lock.json package.json

      - name: Verify Docker is available
        run: docker info > /dev/null

      - name: Build all workspaces
        run: |
          npm run build --workspace=api
          npm run build --workspace=frontend

      # NO_COLOR: Vitest emits ANSI escapes even when not attached to a TTY,
      # which makes failure output far harder to read in Actions logs.
      - name: Run tests
        env:
          NO_COLOR: "1"
        run: npm run test --workspaces --if-present

      # --workspaces --if-present silently skips a workspace that has no test
      # script, so a dropped script would look like a pass. Assert the two
      # workspaces that must always have one still do.
      - name: Assert test scripts still exist
        run: |
          npm pkg get scripts.test --workspace=api | grep -q 'vitest'
          npm pkg get scripts.test --workspace=frontend | grep -q 'vitest'
          npm pkg get scripts.test --workspace=packages/crypto | grep -q 'vitest'

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only production dependencies gate the build. The known high-severity
      # advisories in this tree are dev-only (Testcontainers -> archiver ->
      # glob -> minimatch) and are pruned from the runtime image by
      # `npm ci --omit=dev` in api/Dockerfile, so failing on them would block
      # every PR for a vulnerability that never ships.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
