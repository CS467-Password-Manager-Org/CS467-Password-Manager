services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env — run ./scripts/setup.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env — run ./scripts/setup.sh}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env — run ./scripts/setup.sh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: prod          # OPS-03: a plain `docker compose up` is production
    # Tagged per target. Without this, Compose names the image after the service
    # alone, so the dev and prod targets overwrite each other under one tag and
    # a plain `docker compose up` (no --build) silently starts whichever was
    # built last — the dev image with watchers, breaking OPS-03 with no error.
    image: cs467-password-manager-api:prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?missing in .env — run ./scripts/setup.sh}
      SALT_PEPPER: ${SALT_PEPPER:?missing in .env — run ./scripts/setup.sh}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
      AUTH_VERIFY_RATE_LIMIT_WINDOW_MS: ${AUTH_VERIFY_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_VERIFY_RATE_LIMIT_MAX_PER_ACCOUNT: ${AUTH_VERIFY_RATE_LIMIT_MAX_PER_ACCOUNT:-10}
      AUTH_VERIFY_RATE_LIMIT_MAX_PER_IP: ${AUTH_VERIFY_RATE_LIMIT_MAX_PER_IP:-30}
      # One hop, because the browser always reaches the API through the frontend
      # container: nginx in prod, the Vite dev server proxy in dev. Both forward
      # X-Forwarded-For. At 0 the API would see only the proxy's address and
      # every user would share a single rate-limit bucket.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "${API_PORT:-5001}:5000"
    # No volumes: the prod image is self-contained. Mounting source or a
    # node_modules volume here would shadow the built image — a pre-existing
    # volume from the old dev-only image would mount straight over the new
    # image's dependencies, producing either a module-not-found crash or a
    # silently stale container that makes OPS-03 appear to pass.
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod        # OPS-03: a plain `docker compose up` is production
    # Separate tag per target, for the same reason as api above.
    image: cs467-password-manager-frontend:prod
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # No volumes, for the same reason as api: the prod image is a static bundle
    # behind nginx, and mounting source or a node_modules volume over it would
    # either break the image or silently serve stale files.
    depends_on:
      - api

volumes:
  db-data:
